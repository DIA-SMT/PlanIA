# Sitio definitivo de PlanIA: HTTP redirige a HTTPS.
# Requiere el certificado ya emitido:  certbot certonly --nginx -d <dominio>
# Instalación (como root, reemplazando __DOMINIO__ y __PUERTO__): ver DEPLOY.md.
#
# Sin default_server: en nginx 1.24 esa marca es del puerto entero.
# "http2" va en la línea listen: "http2 on;" es de nginx 1.25 y acá no compila.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/plania.access.log;
    error_log  /var/log/nginx/plania.error.log;

    # Los documentos de actividad aceptan hasta 10 MB.
    client_max_body_size 12M;

    # Estáticos de Next directo desde disco (la carpeta del proyecto es 751).
    location /_next/static/ {
        alias /srv/plania/actual/.next/static/;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # El corte trimestral y el chatbot pueden pasar el minuto por defecto.
        proxy_read_timeout 300s;
    }
}
