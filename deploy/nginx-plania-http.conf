# Sitio inicial, sólo HTTP: sirve para que certbot valide el dominio.
# Lo instala preparar-servidor.sh; después se reemplaza por nginx-plania.conf.
# Sin default_server: en nginx 1.24 esa marca es del puerto entero.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    access_log /var/log/nginx/plania.access.log;
    error_log  /var/log/nginx/plania.error.log;

    location / {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_set_header Host $host;
    }
}
