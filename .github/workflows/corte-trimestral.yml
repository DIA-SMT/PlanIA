name: Corte trimestral del POA

# Corre todos los días y el endpoint decide: toma la foto solo si quedó algún
# cierre de trimestre sin ella.
#
# Por qué así y no un cron por trimestre: GitHub Actions no sabe expresar "el
# último día del trimestre" (30 o 31 según el mes), y un cron con las cuatro
# fechas escritas a mano se rompe callado el día que cambie el calendario del
# POA. Corriendo todos los días, el filtro lo hace el endpoint con la fecha real.
#
# Horario: 02:00 UTC = 23:00 del día ANTERIOR en Tucumán (Argentina es UTC-3
# todo el año). O sea que la corrida del 1 de octubre a las 02:00 UTC ve como
# fecha local el 30 de septiembre y guarda el día del cierre COMPLETO, con las
# cargas que entraron durante la última jornada.
#
# Estuvo en 12:00 UTC (09:00 de Tucumán) hasta el 11.09.2026. El problema de esa
# hora no era técnico: la foto del cierre salía con el estado de la mañana y se
# perdían las catorce horas restantes del día que el informe dice reportar, que
# es justo cuando más se carga.
#
# Un atraso de la cola de Actions más allá de las 03:00 UTC hace que la fecha
# local pase al 1 de octubre, pero eso ya no rompe nada: el endpoint no pregunta
# "hoy es el último día del trimestre" sino "quedó algún cierre sin foto", así
# que rescata el cierre y lo fecha en el día correcto. Esa red no existía cuando
# se eligió el horario anterior, y es lo que hace segura esta hora.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fecha_corte:
        description: 'Fecha del corte (YYYY-MM-DD). Vacío = hoy.'
        required: false
      forzar:
        description: 'Tomar la foto de hoy aunque no falte ningún cierre'
        type: boolean
        default: false

jobs:
  corte:
    runs-on: ubuntu-latest
    steps:
      - name: Tomar la foto del corte
        env:
          PLANIA_URL: ${{ secrets.PLANIA_URL }}
          CORTE_SECRET: ${{ secrets.CORTE_TRIMESTRAL_SECRET }}
          FECHA: ${{ github.event.inputs.fecha_corte }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          set -uo pipefail

          if [ -z "${PLANIA_URL:-}" ] || [ -z "${CORTE_SECRET:-}" ]; then
            echo "::error::Faltan los secrets PLANIA_URL o CORTE_TRIMESTRAL_SECRET"
            exit 1
          fi

          # En la corrida programada no hay inputs: el endpoint filtra por fin
          # de trimestre. En la manual, `forzar` puede saltear ese filtro.
          SOLO_FIN=true
          if [ "${FORZAR:-false}" = "true" ]; then SOLO_FIN=false; fi

          if [ -n "${FECHA:-}" ]; then
            BODY="{\"fecha_corte\":\"${FECHA}\",\"solo_fin_de_trimestre\":${SOLO_FIN}}"
          else
            BODY="{\"solo_fin_de_trimestre\":${SOLO_FIN}}"
          fi

          echo "POST ${PLANIA_URL}/api/corte-trimestral"
          echo "cuerpo: ${BODY}"

          RESP=$(mktemp)
          STATUS=$(curl -sS -o "$RESP" -w '%{http_code}' -X POST \
            "${PLANIA_URL}/api/corte-trimestral" \
            -H "Authorization: Bearer ${CORTE_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            -d "$BODY")

          echo "HTTP ${STATUS}"
          cat "$RESP"
          echo ""

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::El corte falló (HTTP ${STATUS})"
            exit 2
          fi

          if grep -q '"cierre_perdido"' "$RESP"; then
            # Un cierre que quedó sin foto y ya pasó la ventana de rescate. NO se
            # inventa: guardar los datos de hoy fechados meses atrás seria
            # afirmar algo falso sobre un día en el que nadie miró. Sale como
            # aviso y no como error para no dejar el check en rojo todos los días
            # por algo que ya no tiene arreglo.
            echo "::warning::Hay un cierre sin foto fuera de la ventana de rescate. Ese trimestre no se puede reconstruir; el informe tiene que decir a qué fecha corresponden sus cifras."
          elif grep -q '"omitido":true' "$RESP"; then
            echo "No falta ninguna foto de cierre: nada que hacer."
          elif grep -q '"rescatado":true' "$RESP"; then
            echo "::warning::Se rescató un cierre que no se había tomado el día del cierre. Revisar por qué falló la corrida de ese día."
          else
            echo "::notice::Foto del corte tomada."
          fi
